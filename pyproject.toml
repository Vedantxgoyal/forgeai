[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "0.1.0"
description = "ForgeAI: a factory that turns a one-paragraph brief and a document folder into a tested, self-improving RAG agent with an honest quality report."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.6",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "diskcache>=5.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Better dense embeddings + cross-encoder reranking. Without it ForgeAI falls back
# to Ollama embeddings, then to a TF-IDF/LSA embedder, so it never hard-fails.
embed = ["sentence-transformers>=3.0"]
xlsx = ["openpyxl>=3.1"]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[project.scripts]
forge = "forgeai.cli:app"

[tool.setuptools.packages.find]
include = ["forgeai*"]

[tool.setuptools.package-data]
forgeai = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
